<button class="chat-launcher" [class.active]="isChatVisible" (click)="toggleChat()">
    @if (isChatVisible) {
        <svg class="launcher-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6L18 18"></path>
            <path d="M18 6L6 18"></path>
        </svg>
    } @else {
        <svg class="launcher-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8.5h10"></path>
            <path d="M7 12h6.5"></path>
            <path d="M12 3C6.477 3 2 6.91 2 11.734c0 2.18.914 4.173 2.43 5.7L4 21l4.14-2.033c1.18.32 2.474.5 3.86.5 5.523 0 10-3.91 10-8.733C22 6.91 17.523 3 12 3Z"></path>
        </svg>
    }
</button>

<main class="chat-container" *ngIf="isChatVisible">
    <header class="chat-header">
        <div class="header-info">
            <div class="status-wrapper">
                <div class="status-dot" [class.loading]="isLoading"></div>
            </div>
            <div class="title-container">
                <div class="title-row">
                    <h1>ERPMs Assistant</h1>
                    <button class="btn-green-status">Actif</button>
                </div>
                <p class="subtitle">{{ isLoading ? 'L\'IA réfléchit...' : 'Prêt à vous aider' }}</p>
            </div>
        </div>
    </header>

    <div class="messages-viewport" #scrollMe>
        <div *ngFor="let msg of messages" [ngClass]="msg.isUser ? 'message user' : 'message ai'">
            <div class="avatar" *ngIf="!msg.isUser">
                <svg class="bot-avatar-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4v3"></path>
                    <path d="M8 10h8"></path>
                    <rect x="5" y="7" width="14" height="11" rx="4"></rect>
                    <path d="M9 18v2"></path>
                    <path d="M15 18v2"></path>
                    <path d="M8 12h.01"></path>
                    <path d="M16 12h.01"></path>
                </svg>
            </div>
            <div class="bubble">
                <div class="message-text">{{ msg.text }}</div>

                <div *ngIf="msg.data && msg.data.length > 0" class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th *ngFor="let key of getKeys(msg.data[0])">{{ key }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of msg.data">
                                <td *ngFor="let key of getKeys(row)">{{ row[key] }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <span class="time">maintenant</span>
            </div>
        </div>

        <div *ngIf="isLoading" class="message ai">
            <div class="avatar">
                <svg class="bot-avatar-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4v3"></path>
                    <path d="M8 10h8"></path>
                    <rect x="5" y="7" width="14" height="11" rx="4"></rect>
                    <path d="M9 18v2"></path>
                    <path d="M15 18v2"></path>
                    <path d="M8 12h.01"></path>
                    <path d="M16 12h.01"></path>
                </svg>
            </div>
            <div class="bubble loading-dots">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
        </div>
    </div>

    <footer class="input-area">
        <div class="input-wrapper">
            <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Posez votre question...">
            <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isLoading">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </footer>
</main>
